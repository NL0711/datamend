# Demo SQLite storage resets when this free service restarts.
services:
  - type: web
    name: datamend-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "False"
      - key: DEFAULT_DATA_SOURCE
        value: SIMULATED
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/skyguard.db
      - key: CORS_ORIGINS
        sync: false
