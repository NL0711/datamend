# Schema migrations (Alembic). The URL is NOT here: backend/migrations/env.py reads DATABASE_URL from the environment or .env (backend/app/config.py).
#   alembic upgrade head                      apply every migration (run this on a deployed database)
#   alembic revision --autogenerate -m "..."  write a new migration after a model changes
# The app still calls Base.metadata.create_all at start-up, which only creates MISSING tables and never alters one: a changed column needs a migration.
[alembic]
script_location = backend/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
