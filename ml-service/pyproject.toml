[project]
name = "ml-service"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "xarray>=2025.6.1",
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["."]

