# Kaggle notebook with two T4 GPUs. Two experiments run at once, one per GPU.
compute:
  devices: [cuda:0, cuda:1]
  parallel_experiments: 2
  num_workers: 2
  batch_size: 4096
  amp: true
  # Budget caps. Provisional until the timing run has been done on Kaggle.
  max_hours_per_run: 2.0
  max_hours_total: 60.0
  session_hours: 11.0      # stop and checkpoint before the session limit (check the limit on your account); resume next session
