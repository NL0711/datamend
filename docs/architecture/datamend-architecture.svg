<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1370" viewBox="0 0 1800 1370" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aNavy" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#14264F"/></marker>
    <marker id="aOrange" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#C27A1E"/></marker>
    <marker id="aTeal" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#0F6E83"/></marker>
    <marker id="aWhite" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#FFFFFF"/></marker>
    <marker id="aGold" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="24" markerHeight="24" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12 z" fill="#F4C76B"/></marker>
  </defs>
  <rect width="1800" height="1370" fill="#FFFFFF"/>

  <!-- FRONTEND -->
  <rect x="25" y="30" width="480" height="610" rx="30" fill="#E3EBFA"/>
  <text x="55" y="95" font-size="44" font-weight="700" fill="#14264F">FRONTEND</text>
  <text x="55" y="140" font-size="33" fill="#14264F">React + TypeScript (Vercel)</text>
  <rect x="60" y="235" width="410" height="250" rx="16" fill="#FFFFFF"/>
  <text x="265" y="300" font-size="38" font-weight="600" text-anchor="middle" fill="#14264F">User &amp; Dashboard</text>
  <text x="265" y="352" font-size="27" text-anchor="middle" fill="#14264F">Import · Explore &amp; clean</text>
  <text x="265" y="392" font-size="27" text-anchor="middle" fill="#14264F">Stations · Validate · Review</text>
  <text x="265" y="432" font-size="27" text-anchor="middle" fill="#14264F">Anomalies · Models</text>

  <!-- HTTPS -->

  <!-- BACKEND -->
  <rect x="625" y="30" width="640" height="610" rx="26" fill="#F7F9FF" stroke="#14264F" stroke-width="6"/>
  <text x="655" y="95" font-size="44" font-weight="700" fill="#14264F">BACKEND</text>
  <text x="655" y="140" font-size="33" fill="#14264F">FastAPI + Docker (Render)</text>
  <rect x="655" y="160" width="580" height="80" rx="14" fill="#DCE8FB" stroke="#9BB7E4" stroke-width="4"/>
  <text x="945" y="214" font-size="38" font-weight="600" text-anchor="middle" fill="#14264F">REST API</text>
  <path d="M945 242 V288" stroke="#14264F" stroke-width="4" marker-end="url(#aNavy)"/>
  <rect x="655" y="290" width="580" height="130" rx="14" fill="#DCE8FB" stroke="#9BB7E4" stroke-width="4"/>
  <text x="945" y="345" font-size="38" font-weight="600" text-anchor="middle" fill="#14264F">Validation &amp; Rules Engine</text>
  <text x="945" y="392" font-size="27" text-anchor="middle" fill="#14264F">Input check → 12 checks → Score &amp; Evidence</text>
  <path d="M945 422 V468" stroke="#14264F" stroke-width="4" marker-end="url(#aNavy)"/>
  <rect x="655" y="470" width="580" height="130" rx="14" fill="#DCE8FB" stroke="#9BB7E4" stroke-width="4"/>
  <text x="945" y="525" font-size="38" font-weight="600" text-anchor="middle" fill="#14264F">Database &amp; Review Loop</text>
  <text x="945" y="572" font-size="27" text-anchor="middle" fill="#14264F">PostgreSQL · TimescaleDB (Tiger Cloud)</text>

  <!-- EXTERNAL SERVICES -->
  <rect x="1340" y="30" width="435" height="610" rx="26" fill="#FFF7EC" stroke="#C27A1E" stroke-width="6"/>
  <text x="1557" y="92" font-size="38" font-weight="700" text-anchor="middle" fill="#B0701B">EXTERNAL SERVICES</text>
  <rect x="1375" y="125" width="365" height="125" rx="14" fill="#FFF3E0" stroke="#C27A1E" stroke-width="5"/>
  <text x="1557" y="185" font-size="35" font-weight="600" text-anchor="middle" fill="#14264F">Weather Union API</text>
  <text x="1557" y="228" font-size="27" text-anchor="middle" fill="#14264F">(580 live gauges)</text>
  <rect x="1375" y="285" width="365" height="125" rx="14" fill="#FFF3E0" stroke="#C27A1E" stroke-width="5"/>
  <text x="1557" y="345" font-size="35" font-weight="600" text-anchor="middle" fill="#14264F">Kaggle · Amazon S3</text>
  <text x="1557" y="388" font-size="27" text-anchor="middle" fill="#14264F">(dataset import)</text>
  <rect x="1375" y="445" width="365" height="125" rx="14" fill="#FFF3E0" stroke="#C27A1E" stroke-width="5"/>
  <text x="1557" y="505" font-size="35" font-weight="600" text-anchor="middle" fill="#14264F">AI Narrator</text>
  <text x="1557" y="548" font-size="27" text-anchor="middle" fill="#14264F">(Gemini · MCP, optional)</text>
  <path d="M1375 188 H1240" stroke="#C27A1E" stroke-width="5" marker-end="url(#aOrange)"/>
  <path d="M1375 348 H1240" stroke="#C27A1E" stroke-width="5" marker-end="url(#aOrange)"/>
  <path d="M1375 520 H1240" stroke="#C27A1E" stroke-width="5" marker-start="url(#aOrange)" marker-end="url(#aOrange)"/>

  <!-- ML FEEDBACK LOOP + OFFLINE TRAINING -->
  <rect x="25" y="800" width="1750" height="535" rx="30" fill="#17728A"/>
  <text x="900" y="862" font-size="44" font-weight="700" text-anchor="middle" fill="#FFFFFF">ML FEEDBACK LOOP &amp; OFFLINE TRAINING</text>

  <g font-size="34" font-weight="600" fill="#14264F" text-anchor="middle">
    <rect x="55" y="930" width="370" height="140" rx="14" fill="#E3F4F8"/>
    <rect x="495" y="930" width="370" height="140" rx="14" fill="#E3F4F8"/>
    <rect x="935" y="930" width="370" height="140" rx="14" fill="#E3F4F8"/>
    <rect x="1375" y="930" width="370" height="140" rx="14" fill="#E3F4F8"/>
    <text x="240" y="988">1. Reviewer labels</text>
    <text x="680" y="988">2. Training snapshot</text>
    <text x="1120" y="988">3. Retrain</text>
    <text x="1560" y="988">4. Registry &amp; gate</text>
  </g>
  <g font-size="26" fill="#14264F" text-anchor="middle">
    <text x="240" y="1036">fault · false alarm · extreme</text>
    <text x="680" y="1036">time cut, test years locked</text>
    <text x="1120" y="1036">server CPU · Kaggle · AWS</text>
    <text x="1560" y="1036">shadow run vs champion</text>
  </g>
  <path d="M427 1000 H493" stroke="#FFFFFF" stroke-width="5" marker-end="url(#aWhite)"/>
  <path d="M867 1000 H933" stroke="#FFFFFF" stroke-width="5" marker-end="url(#aWhite)"/>
  <path d="M1307 1000 H1373" stroke="#FFFFFF" stroke-width="5" marker-end="url(#aWhite)"/>

  <g font-size="34" font-weight="600" fill="#14264F" text-anchor="middle">
    <rect x="55" y="1150" width="370" height="130" rx="14" fill="#C9E7EE"/>
    <rect x="495" y="1150" width="370" height="130" rx="14" fill="#C9E7EE"/>
    <rect x="935" y="1150" width="370" height="130" rx="14" fill="#C9E7EE"/>
    <text x="240" y="1206">IMD Rainfall Data</text>
    <text x="680" y="1206">Train STNet Model</text>
    <text x="1120" y="1206">Calibrate &amp; Evaluate</text>
  </g>
  <g font-size="26" fill="#14264F" text-anchor="middle">
    <text x="240" y="1252">RF25 gridded rainfall</text>
    <text x="680" y="1252">GPU (Kaggle)</text>
    <text x="1120" y="1252">fixed false-alarm budget</text>
  </g>
  <path d="M427 1215 H493" stroke="#FFFFFF" stroke-width="5" marker-end="url(#aWhite)"/>
  <path d="M867 1215 H933" stroke="#FFFFFF" stroke-width="5" marker-end="url(#aWhite)"/>
  <path d="M1307 1215 H1560 V1072" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" marker-end="url(#aWhite)"/>
  <text x="1433" y="1197" font-size="25" text-anchor="middle" fill="#FFFFFF">register model</text>
  <!-- loop arrows between the backend and the ML band -->
  <path d="M470 360 H565 V200 H652" fill="none" stroke="#14264F" stroke-width="5" marker-end="url(#aNavy)"/>
  <text x="525" y="440" font-size="30" text-anchor="middle" fill="#14264F" transform="rotate(-90 525 440)">HTTPS</text>
  <path d="M780 602 V722 H240 V928" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
  <path d="M1560 928 V752 H1110 V602" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linejoin="round"/>
  <path d="M780 602 V722 H240 V928" fill="none" stroke="#14264F" stroke-width="5" marker-end="url(#aNavy)"/>
  <text x="510" y="706" font-size="29" text-anchor="middle" fill="#14264F">reviewer labels</text>
  <path d="M1560 928 V752 H1110 V602" fill="none" stroke="#0F6E83" stroke-width="5" marker-end="url(#aTeal)"/>
  <text x="1335" y="736" font-size="29" text-anchor="middle" fill="#0F6E83">model score in evidence</text>

</svg>
