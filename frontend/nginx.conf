# DataMend frontend: nginx gateway.
# Serves the Vite SPA and forwards /api to the backend, so the browser uses same-origin relative URLs.
#
# Docker Compose service names:
#   frontend -> nginx:80 (published as localhost:5173)
#   backend  -> uvicorn:8000

upstream datamend_backend {
  server backend:8000 max_fails=3 fail_timeout=5s;
}

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Uploads of up to 10 MB are accepted by the platform (nginx's default of 1 MB would reject them before the backend sees them).
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml text/csv;
  gzip_min_length 1024;

  # Cache hashed Vite assets, never cache index.html
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # REST API -> FastAPI (the /api prefix is preserved). A 200,000-row validation can take a while, so reads are allowed 120 s.
  location /api/ {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # FastAPI docs (optional, same backend)
  location /docs {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback, must be LAST so /api matches first
  location / {
    try_files $uri $uri/ /index.html;
  }
}
