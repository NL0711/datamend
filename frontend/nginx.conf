# DataMend frontend — nginx gateway.
# Serves the Vite SPA on localhost and forwards API + WebSocket to the backend,
# so the browser can use same-origin relative URLs (/api, /ws/live).
#
# Docker Compose service names:
#   frontend -> nginx:80 (published as localhost:5173)
#   backend  -> uvicorn:8000
#
# Browser flow on localhost:
#   http://localhost:5173/        -> index.html (SPA)
#   http://localhost:5173/api/... -> http://backend:8000/api/...
#   ws://localhost:5173/ws/live   -> ws://backend:8000/ws/live

upstream datamend_backend {
  server backend:8000 max_fails=3 fail_timeout=5s;
}

server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Cache hashed Vite assets, never cache index.html
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # REST API -> FastAPI (preserve /api/ prefix; backend router is prefix="/api")
  location /api/ {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # FastAPI docs (optional, same backend)
  location /docs {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /openapi.json {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket live telemetry -> FastAPI @router.websocket("/ws/live")
  location /ws/ {
    proxy_pass http://datamend_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
  }

  # SPA fallback — must be LAST so /api and /ws match first
  location / {
    try_files $uri $uri/ /index.html;
  }
}
